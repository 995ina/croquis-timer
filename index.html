<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CROQUIS">
<meta name="application-name" content="CROQUIS TIMER">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>CROQUIS TIMER</title>
<style>
:root{color-scheme:light;--ink:#202124;--muted:#73777d;--line:#e5e7eb;--panel:#f5f6f7;--accent:#202124}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:#fff}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:0;overflow:hidden}
header{min-height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);gap:12px}
.brand{font-size:14px;font-weight:750;letter-spacing:.13em}
.subbrand{font-size:11px;color:var(--muted);letter-spacing:.04em;margin-left:9px}
.header-actions{display:flex;gap:8px;align-items:center}
button,select,input{font:inherit}
button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 13px;cursor:pointer}
button:hover{background:#f4f4f4}
button:disabled{opacity:.38;cursor:not-allowed}
button.primary{background:#202124;color:#fff;border-color:#202124}
button.primary:hover{background:#3b3d40}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 18px 12px;gap:12px}
.stage{position:relative;flex:1 1 0;min-height:0;background:#f1f2f3;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;display:none}
.empty{padding:28px 34px;text-align:center;color:#6b7280;line-height:1.75;background:rgba(255,255,255,.72);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.55);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.05);max-width:min(92%,460px)}
.empty-kicker{display:block;font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#7b8794;margin-bottom:8px}
.empty strong{display:block;color:#1f2937;font-size:clamp(22px,3vw,30px);line-height:1.2;letter-spacing:.04em;margin-bottom:8px}
.empty p{margin:0;font-size:13px;color:#6b7280}
.counter{position:absolute;left:14px;bottom:13px;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border-radius:7px;padding:6px 10px;font-size:12px;color:#333}
/* 円形カウントダウン時計：背景画像の視認性を保つ半透明パネル */
.overlay-timer{position:absolute;right:14px;top:13px;width:154px;height:154px;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);border-radius:50%;box-shadow:0 2px 14px rgba(0,0,0,.12);display:grid;place-items:center;pointer-events:none}
.overlay-timer svg{display:block;width:100%;height:100%}
.timer-track{fill:none;stroke:#d9e2e9;stroke-width:10}
.timer-progress{fill:none;stroke:#3881c6;stroke-width:10;stroke-linecap:round;transform:rotate(-90deg);transform-origin:80px 80px;transition:stroke-dashoffset .1s linear}
.timer-time{font-size:29px;font-weight:700;letter-spacing:-.8px;fill:#202124;font-variant-numeric:tabular-nums}
.timer-caption{font-size:11px;fill:#69737c}
.timer-tick{stroke:#8d99a3;stroke-width:1.8}
@media(max-width:600px){.overlay-timer{width:120px;height:120px;right:9px;top:9px}}
.controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:9px}
.time-settings{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}
.time-settings label{font-size:12px;color:var(--muted)}
select,input[type=number]{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 9px;color:var(--ink)}
input[type=number]{width:76px}
.options{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:18px;color:#555;font-size:12px}
.options label{display:flex;align-items:center;gap:6px;cursor:pointer}
.status{text-align:center;color:var(--muted);font-size:12px;min-height:17px}
footer{flex:none;border-top:1px solid var(--line);padding:10px 18px;color:#888;font-size:11px;text-align:center}
.file-input{display:none}
#fileButton{white-space:nowrap}
body.fullscreen header,body.fullscreen footer,body.focus-mode header,body.focus-mode footer{display:none}
body.fullscreen main,body.focus-mode main{padding:10px}
body.fullscreen .stage,body.focus-mode .stage{border-radius:0}
@media(max-width:600px){
 header{height:52px;padding:0 12px}.subbrand{display:none}
 main{padding:9px;gap:9px}.stage{min-height:0;border-radius:8px}
 .controls button{padding:11px 13px;min-height:44px}.options{gap:12px}
}
/* iPhone / iPad: safe areas, tap targets, and horizontal viewport support */
html{-webkit-text-size-adjust:100%}
header{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right));padding-top:env(safe-area-inset-top)}
main{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));padding-bottom:max(10px,env(safe-area-inset-bottom));overflow:hidden}
button,select,input[type=number]{touch-action:manipulation}
button{min-height:42px}
#fileButton{min-height:44px}
#photo{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.counter{max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(hover:none) and (pointer:coarse){button,select{min-height:44px}input[type=checkbox]{width:18px;height:18px}}
@media(max-width:640px){
  header{min-height:52px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  main{gap:7px;padding-top:8px}
  .time-settings{gap:6px}
  .controls{gap:6px}
  .controls button{font-size:13px;padding:10px 9px}
  .options{gap:10px;font-size:11px}
  .status{font-size:11px}
  footer{font-size:10px;padding:7px 10px}
  .overlay-timer{width:clamp(86px,24vw,120px);height:clamp(86px,24vw,120px)}
  .empty{padding:20px 16px}
  .empty strong{font-size:clamp(19px,6vw,26px)}
}
@media(max-height:580px) and (orientation:landscape){
  header{min-height:42px;height:42px;padding-top:0}
  main{gap:5px;padding-top:4px;padding-bottom:4px}
  .time-settings select{padding:5px 8px}
  .controls button{min-height:34px;padding:5px 10px}
  .options{font-size:10px;gap:12px}
  .status{min-height:12px}
  footer{display:none}
  .overlay-timer{width:clamp(85px,16vh,120px);height:clamp(85px,16vh,120px)}
}
@media(max-width:370px){.controls button{font-size:12px;padding:8px 6px}.brand{font-size:12px}}
</style>
</head>
<body>
<header>
  <div><span class="brand">CROQUIS TIMER</span><span class="subbrand">ver.1.9</span></div>
  <div class="header-actions">
    <input class="file-input" id="files" type="file" accept="image/*" multiple>
    <button id="fileButton">画像を選択</button>
  </div>
</header>
<main>
  <section class="stage" id="stage">
    <img id="photo" alt="クロッキー参考画像">
    <div class="empty" id="empty"><span class="empty-kicker">Croquis Timer</span><strong>Ready to Sketch?</strong><p>Select multiple reference images to begin your croquis session.</p></div>
    <div class="overlay-timer" id="timer" role="timer" aria-label="残り時間 01:00">
      <svg viewBox="0 0 160 160" aria-hidden="true" focusable="false">
        <circle class="timer-track" cx="80" cy="80" r="62" />
        <circle class="timer-progress" id="timerProgress" cx="80" cy="80" r="62" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" />
        <g class="timer-tick" opacity=".65">
          <line x1="80" y1="12" x2="80" y2="18" />
          <line x1="80" y1="142" x2="80" y2="148" />
          <line x1="12" y1="80" x2="18" y2="80" />
          <line x1="142" y1="80" x2="148" y2="80" />
        </g>
        <text class="timer-time" id="timerText" x="80" y="79" text-anchor="middle">01:00</text>
        <text class="timer-caption" x="80" y="99" text-anchor="middle">残り時間</text>
      </svg>
    </div>
    <div class="counter" id="counter">画像未選択</div>
  </section>
  <div class="time-settings">
    <label for="preset">表示時間</label>
    <select id="preset">
      <option value="30">30秒</option><option value="60" selected>1分</option>
      <option value="120">2分</option><option value="300">5分</option><option value="600">10分</option>
      <option value="custom">自由設定</option>
    </select>
    <span id="customWrap" hidden><input id="customMinutes" type="number" min="0" max="999" value="1" aria-label="分"> 分 <input id="customSeconds" type="number" min="0" max="59" value="0" aria-label="秒"> 秒</span>
  </div>
  <div class="controls">
    <button id="prev" disabled>← 前へ</button>
    <button class="primary" id="start" disabled>START</button>
    <button id="next" disabled>次へ →</button>
    <button id="reset">リセット</button>
    <button id="full">全画面</button>
  </div>
  <div class="options">
    <label><input type="checkbox" id="shuffle" checked> ランダム再生</label>
    <label><input type="checkbox" id="loop" checked> 繰り返し</label>
    <label><input type="checkbox" id="sound" checked> 終了音</label>
  </div>
  <div class="status" id="status">画像を選択すると開始できます</div>
</main>
<footer>選択した画像はこのブラウザ内で表示します。外部サーバーへのアップロードは行いません。</footer>
<script>
(() => {
 const $ = id => document.getElementById(id);
 const filesInput=$('files'), photo=$('photo');
 let images=[], order=[], index=0, remaining=60, duration=60, running=false, interval=null, deadline=0, objectUrls=[];
 let audioCtx=null, wakeLock=null;
 const isImage=f=>f.type.startsWith('image/');
 function format(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
 function setStatus(t){$('status').textContent=t}
 function getDuration(){
   if($('preset').value!=='custom') return Number($('preset').value);
   return Math.max(1,Number($('customMinutes').value||0)*60+Number($('customSeconds').value||0));
 }
 function updateTimer(){
   const display=format(remaining);
   $('timerText').textContent=display;
   $('timer').setAttribute('aria-label','残り時間 '+display);
   const ratio=duration>0?Math.max(0,Math.min(1,remaining/duration)):0;
   $('timerProgress').setAttribute('stroke-dashoffset',String(100*(1-ratio)));
 }
 function makeOrder(){
   order=images.map((_,i)=>i);
   if($('shuffle').checked){
     for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
   }
   index=0;
 }
 function showImage(){
   if(!images.length)return;
   const item=images[order[index]];
   photo.src=item.url;photo.style.display='block';$('empty').style.display='none';
   $('counter').textContent=(index+1)+' / '+images.length+'　'+item.name;
   $('prev').disabled=images.length<2;$('next').disabled=images.length<2;
 }
 function stop(){
   releaseWakeLock();
   running=false;
   if(interval!==null){clearInterval(interval);interval=null;}
   $('start').textContent='START';
 }
 function loadFiles(fileList){
   const selected=Array.from(fileList).filter(isImage).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));
   if(!selected.length){setStatus('画像ファイルが見つかりませんでした');return;}
   stop();objectUrls.forEach(URL.revokeObjectURL);objectUrls=[];
   images=selected.map(f=>{const url=URL.createObjectURL(f);objectUrls.push(url);return {name:f.name,url};});
   makeOrder();duration=getDuration();remaining=duration;showImage();updateTimer();
   $('start').disabled=false;setStatus(images.length+'枚の画像を読み込みました');
 }
 function activateSound(){
   if(!$('sound').checked)return;
   try{
     const C=window.AudioContext||window.webkitAudioContext;
     if(!C)return;
     if(!audioCtx)audioCtx=new C();
     if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
   }catch(e){}
 }
 function beep(){
   if(!$('sound').checked)return;
   try{
     if(!audioCtx || audioCtx.state!=='running')return;
     const ctx=audioCtx;
     [0,.22,.44].forEach(t=>{
       const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;o.type='sine';
       g.gain.setValueAtTime(.0001,ctx.currentTime+t);
       g.gain.exponentialRampToValueAtTime(.16,ctx.currentTime+t+.02);
       g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+t+.16);
       o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.17);
     });
   }catch(e){}
 }
 async function requestWakeLock(){
   if(!running || document.visibilityState!=='visible' || !('wakeLock' in navigator))return;
   try{
     if(!wakeLock) {
       wakeLock=await navigator.wakeLock.request('screen');
       wakeLock.addEventListener('release',()=>{wakeLock=null;});
     }
   }catch(e){/* Unsupported or disallowed by device settings */}
 }
 function releaseWakeLock(){
   if(wakeLock){const current=wakeLock;wakeLock=null;current.release().catch(()=>{});}
 }
 function advance(){
   if(!images.length)return;
   if(index<order.length-1)index++;
   else if($('loop').checked){makeOrder();}
   else {stop();remaining=0;updateTimer();setStatus('最後の画像まで終了しました');return;}
   showImage();duration=getDuration();remaining=duration;updateTimer();
 }
 function tick(){
   remaining=Math.max(0,(deadline-Date.now())/1000);updateTimer();
   if(remaining<=0){beep();advance();if(running)deadline=Date.now()+remaining*1000+duration*1000;}
 }
 function start(){
   if(!images.length)return;
   if(running){stop();setStatus('一時停止中');return;}
   if(remaining<=0){remaining=getDuration();}
   activateSound();
   running=true;$('start').textContent='PAUSE';setStatus('再生中');
   requestWakeLock();
   deadline=Date.now()+remaining*1000;
   interval=setInterval(()=>{
     remaining=Math.max(0,(deadline-Date.now())/1000);updateTimer();
     if(remaining<=0){
       beep();
       const wasRunning=running;advance();
       if(running){deadline=Date.now()+duration*1000;}
     }
   },100);
 }
 function manualMove(delta){
   if(!images.length)return;
   const wasRunning=running;stop();
   let next=index+delta;
   if(next<0)next=$('loop').checked?order.length-1:0;
   if(next>=order.length)next=$('loop').checked?0:order.length-1;
   index=next;showImage();duration=getDuration();remaining=duration;updateTimer();
   setStatus(wasRunning?'次の画像に移動しました':'画像を表示中');
   if(wasRunning)start();
 }
 $('fileButton').onclick=()=>filesInput.click();
 filesInput.onchange=e=>{loadFiles(e.target.files);e.target.value='';};
 $('preset').onchange=()=>{$('customWrap').hidden=$('preset').value!=='custom';if(!running){duration=getDuration();remaining=duration;updateTimer();}};
 ['customMinutes','customSeconds'].forEach(id=>$(id).onchange=()=>{if(!running){duration=getDuration();remaining=duration;updateTimer();}});
 $('start').onclick=start;$('next').onclick=()=>manualMove(1);$('prev').onclick=()=>manualMove(-1);
 function resetTimer(){
   // 画像データ・再生順は維持し、進行状況とタイマーだけを初期化する。
   stop();
   deadline=0;
   // 表示時間の選択と自由設定も初期値（1分）に戻す。
   $('preset').value='60';
   $('customMinutes').value='1';
   $('customSeconds').value='0';
   $('customWrap').hidden=true;
   duration=getDuration();
   remaining=duration;
   index=0;
   if(images.length){
     showImage(); // カウント表示も「1 / 総枚数」に戻す
     $('start').disabled=false;
     setStatus('リセットしました。表示時間は1分、画像は最初の1枚に戻りました');
   }else{
     $('counter').textContent='画像未選択';
     $('start').disabled=true;
     setStatus('タイマーをリセットしました。画像を選択してください');
   }
   updateTimer();
 }
 $('reset').onclick=resetTimer;
 $('sound').addEventListener('change',()=>{if($('sound').checked)activateSound()});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible' && running){requestWakeLock();}else if(document.visibilityState!=='visible'){releaseWakeLock();}});
 $('shuffle').onchange=()=>{if(images.length){const current=images[order[index]];makeOrder();if(!$('shuffle').checked){index=images.indexOf(current);}showImage();}};
 $('full').onclick=async()=>{
   if(document.body.classList.contains('focus-mode')){
     document.body.classList.remove('focus-mode');$('full').textContent='全画面';return;
   }
   if(document.fullscreenElement){
     try{await document.exitFullscreen();}catch(e){}return;
   }
   if(typeof document.documentElement.requestFullscreen==='function'){
     try{await document.documentElement.requestFullscreen();return;}catch(e){}
   }
   // Safari on iPhone does not expose the standard Fullscreen API.
   // Focus mode hides the app chrome; home-screen mode hides browser chrome too.
   document.body.classList.add('focus-mode');$('full').textContent='戻る';
 };
 document.addEventListener('fullscreenchange',()=>{document.body.classList.toggle('fullscreen',!!document.fullscreenElement);$('full').textContent=document.fullscreenElement?'全画面解除':'全画面';});
 window.addEventListener('beforeunload',()=>objectUrls.forEach(URL.revokeObjectURL));
 if('serviceWorker' in navigator && location.protocol!=='file:'){
   window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
 }
 updateTimer();
})();
</script>
</body>
</html>
